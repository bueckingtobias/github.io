<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>ESTRIQ · Immobilien im Blick</title>
<meta name="robots" content="noindex,nofollow" />
<meta name="theme-color" content="#16181d" />
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="ESTRIQ" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================ SMYRNA GREEN THEME ============================ */
:root{
  /* Standard-Theme: Graphit + Teal-Akzent. Wird per data-theme / data-accent überschrieben. */
  --bg:#16181d;
  --bg2:#1c1f26;
  --panel:rgba(42,46,54,.55);
  --panel-solid:#22262e;
  --glass:rgba(48,52,60,.42);
  --glass-2:rgba(32,35,42,.6);
  --stroke:rgba(180,190,205,.12);
  --stroke-2:rgba(180,190,205,.2);
  --mint:#2dd4bf;
  --mint-2:#5eead4;
  --deep:#0f766e;
  --gold:#d8b978;
  --text:#eef1f5;
  --soft:rgba(220,226,235,.62);
  --softer:rgba(220,226,235,.4);
  --danger:#f0938a;
  --r:22px;--r-sm:16px;--gap:16px;
  --rail:78px;
  --fdisp:"Space Grotesk",system-ui,sans-serif;
  --fbody:"Inter",system-ui,-apple-system,sans-serif;
}
/* ---- Hintergrund-Themes ---- */
[data-theme="smaragd"]{
  --bg:#081813;--bg2:#0a1f1a;--panel:rgba(18,44,36,.55);--panel-solid:#0e2820;
  --glass:rgba(20,48,39,.42);--glass-2:rgba(14,36,29,.6);
  --stroke:rgba(120,200,165,.14);--stroke-2:rgba(120,200,165,.24);
  --text:#eaf5ef;--soft:rgba(210,232,222,.62);--softer:rgba(210,232,222,.4);
}
[data-theme="marine"]{
  --bg:#0d1420;--bg2:#111a2b;--panel:rgba(30,44,68,.55);--panel-solid:#182338;
  --glass:rgba(34,50,76,.42);--glass-2:rgba(22,32,50,.6);
  --stroke:rgba(150,180,220,.13);--stroke-2:rgba(150,180,220,.22);
  --text:#eaf0f8;--soft:rgba(210,222,240,.62);--softer:rgba(210,222,240,.4);
}
/* ---- Akzentfarben ---- */
[data-accent="teal"]  {--mint:#2dd4bf;--mint-2:#5eead4;--deep:#0f766e;}
[data-accent="mint"]  {--mint:#4ade9e;--mint-2:#7ef0bd;--deep:#1f7a5a;}
[data-accent="blau"]  {--mint:#4a9fee;--mint-2:#84c1f7;--deep:#1d5fa8;}
[data-accent="violett"]{--mint:#a98cf0;--mint-2:#c6b2f7;--deep:#6d4bc0;}
[data-accent="bernstein"]{--mint:#e0a94a;--mint-2:#f2c97e;--deep:#a8721d;}
[data-accent="rose"]  {--mint:#ee7a9f;--mint-2:#f7a8c1;--deep:#b03d68;}
[data-accent="rubin"] {--mint:#c0392b;--mint-2:#e05545;--deep:#7d1f16;}
[data-accent="silber"]{--mint:#c8ccd4;--mint-2:#e4e7ec;--deep:#8b9099;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* UI-Elemente nicht markierbar (native App-Haptik); Fließtext/Eingaben schon */
button,.rail-btn,.card,.kpi,.sub-item,.theme-chip,.accent-dot,.ltab,.tl-i,.w-day,
.mini,.drow,.obj-card,.head-pill,.chip,.pillet,nav,.sheet-h,label{
  -webkit-user-select:none;user-select:none}
input,textarea,select,.sheet-b p,.note,.card-t,.num{-webkit-user-select:auto;user-select:auto}
html,body{height:100%}
html{background:var(--bg);overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* Solange der Login sichtbar ist, immer Graphit — kein grünes Durchscheinen */
html.pre-login,html.pre-login body{background:#16181d!important}
body{margin:0;font-family:var(--fbody);color:var(--text);overflow:hidden;overscroll-behavior:none;
  position:fixed;inset:0;width:100%;height:100%;
  touch-action:none;-webkit-touch-callout:none;
  background:
    radial-gradient(1100px 640px at 8% -8%,color-mix(in srgb,var(--mint) 10%,transparent),transparent 55%),
    radial-gradient(900px 560px at 100% 0%,color-mix(in srgb,var(--deep) 18%,transparent),transparent 52%),
    radial-gradient(700px 700px at 60% 120%,color-mix(in srgb,var(--mint) 6%,transparent),transparent 60%),
    linear-gradient(180deg,var(--bg2),var(--bg));
  -webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--mint) 20%,transparent);border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--mint) 38%,transparent);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--mint) 25%,transparent) transparent}

/* ============================ LOGIN ============================ */
#login{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;
  background:
    radial-gradient(680px 420px at 82% 6%,rgba(200,204,212,.09),transparent 58%),
    radial-gradient(560px 380px at 12% 96%,rgba(139,144,153,.16),transparent 60%),
    linear-gradient(180deg,#1c1f26,#16181d)}
#login.hide{display:none}
.hide{display:none!important}
.login-card{width:min(380px,100%);
  background:linear-gradient(180deg,rgba(34,38,46,.66),rgba(32,35,42,.6));
  border:1px solid rgba(180,190,205,.2);border-radius:24px;padding:34px 32px 28px;
  backdrop-filter:blur(32px) saturate(1.15);
  box-shadow:0 32px 70px -22px rgba(0,0,0,.62),0 6px 20px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.07);
  position:relative;overflow:hidden}
.login-card::before{content:"";position:absolute;top:0;left:24%;right:24%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(228,231,236,.5),transparent);pointer-events:none}
.login-orb{position:absolute;width:180px;height:180px;right:-58px;top:-64px;border-radius:50%;
  background:radial-gradient(circle at 42% 42%,rgba(228,231,236,.32),transparent 68%);
  filter:blur(16px);opacity:.36;pointer-events:none}
/* Logo mittig, prominenter — ersetzt den Schriftzug */
.login-logo{display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:26px;position:relative}
.login-logo-img{max-width:300px;max-height:120px;width:78%;object-fit:contain;
  filter:drop-shadow(0 8px 22px color-mix(in srgb,#8b9099 35%,transparent))}
.login-logo-fallback{display:flex;align-items:center;gap:11px}
.login-logo-txt h1{font-family:var(--fdisp);font-size:22px;margin:0;font-weight:600;letter-spacing:.04em}
.mark{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;position:relative;overflow:hidden;
  background:linear-gradient(150deg,#c8ccd4,#8b9099);
  box-shadow:0 8px 20px color-mix(in srgb,#8b9099 48%,transparent),inset 0 1px 0 rgba(255,255,255,.22)}
.mark svg{width:24px;height:24px}
/* Reiter-Umschalter */
.login-tabs{position:relative;display:flex;background:rgba(22,24,29,.55);
  border:1px solid rgba(180,190,205,.2);border-radius:13px;padding:4px;margin-bottom:22px}
.ltab{flex:1;position:relative;z-index:2;background:none;border:none;cursor:pointer;
  padding:10px;font-family:var(--fbody);font-size:14px;font-weight:600;color:var(--softer);
  transition:color .2s;border-radius:9px}
.ltab.active{color:#08120f}
.ltab-ind{position:absolute;z-index:1;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);
  background:linear-gradient(135deg,#c8ccd4,#8b9099);border-radius:9px;
  box-shadow:0 5px 16px color-mix(in srgb,#8b9099 38%,transparent);transition:transform .28s cubic-bezier(.4,0,.2,1)}
.ltab-ind.right{transform:translateX(100%)}
/* Formular: einheitlich linksbündig */
.login-form{display:flex;flex-direction:column}
.field-row{display:flex;flex-direction:column;margin-bottom:14px}
.field-row label,#pwLabel{font-size:12px;color:var(--soft);margin:0 0 7px 2px;font-weight:500;text-align:left}
.field-row input{width:100%;box-sizing:border-box;border-radius:12px;border:1px solid rgba(180,190,205,.2);
  background:rgba(22,24,29,.55);color:#eef1f5;
  padding:13px 15px;font-size:15px;outline:none;font-family:var(--fbody);transition:.18s}
.field-row input:focus{border-color:#c8ccd4;box-shadow:0 0 0 3px color-mix(in srgb,#c8ccd4 15%,transparent)}
.field-row input::placeholder{color:rgba(220,226,235,.4)}
/* Profilbild-Auswahl */
#rowAvatar{display:flex;flex-direction:column;align-items:center;margin:2px 0 18px}
.ava-circle{position:relative;width:88px;height:88px;border-radius:50%;cursor:pointer;padding:0;
  border:2px dashed var(--stroke-2);background:color-mix(in srgb,var(--bg) 50%,transparent);transition:.2s;overflow:visible}
.ava-circle:hover{border-color:#c8ccd4}
.ava-circle.filled{border-style:solid;border-color:color-mix(in srgb,#c8ccd4 50%,transparent)}
.ava-img{position:absolute;inset:0;border-radius:50%;background-size:cover;background-position:center}
.ava-cam{position:absolute;top:50%;left:50%;width:26px;height:26px;transform:translate(-50%,-50%);
  color:var(--softer);transition:.2s}
.ava-circle:hover .ava-cam{color:#e4e7ec}
.ava-circle.filled .ava-cam{display:none}
.ava-edit{position:absolute;right:-2px;bottom:-2px;width:28px;height:28px;border-radius:50%;
  background:linear-gradient(135deg,#c8ccd4,#8b9099);display:none;place-items:center;
  box-shadow:0 4px 12px rgba(0,0,0,.4);border:2px solid var(--bg2)}
.ava-edit svg{width:14px;height:14px}
.ava-circle.filled .ava-edit{display:grid}
.ava-cap{margin-top:11px;font-size:12.5px;color:var(--softer)}
.login-btn{width:100%;margin-top:8px;cursor:pointer;border:none;border-radius:12px;
  background:linear-gradient(135deg,#c8ccd4,#8b9099);color:#08120f;padding:15px;font-size:15px;font-weight:700;
  font-family:var(--fbody);box-shadow:0 10px 26px color-mix(in srgb,#8b9099 40%,transparent);transition:.18s}
.login-btn:hover{filter:brightness(1.06)}
.login-btn:active{transform:scale(.98)}
.login-msg{min-height:18px;margin-top:14px;font-size:12.5px;color:var(--soft);text-align:center;line-height:1.4}
.login-msg.bad{color:var(--danger)}

/* ============================ SHELL ============================ */
#app{height:100dvh;height:100svh;display:grid;grid-template-columns:var(--rail) 1fr;overflow:hidden}
#app.hide{display:none}

.rail{height:100dvh;height:100svh;display:flex;flex-direction:column;align-items:center;gap:6px;padding:34px 0 18px;
  border-right:1px solid var(--stroke);background:linear-gradient(180deg,color-mix(in srgb,var(--bg2) 82%,transparent),color-mix(in srgb,var(--bg) 88%,transparent));backdrop-filter:blur(16px)}
.rail-mark{width:55px;height:55px;border-radius:17px;display:grid;place-items:center;margin-bottom:20px;
  background:linear-gradient(150deg,var(--mint),var(--deep));box-shadow:0 10px 26px color-mix(in srgb,var(--deep) 50%,transparent)}
.rail-mark svg{width:29px;height:29px}
.rail-logo-img{width:100%;height:100%;object-fit:contain;border-radius:12px}
.rail-add{background:linear-gradient(150deg,var(--mint),var(--deep))!important;color:#08120f!important;
  margin-bottom:8px;box-shadow:0 8px 20px color-mix(in srgb,var(--mint) 35%,transparent)}
.rail-add:hover{filter:brightness(1.08)}
.rail-add svg{width:23px;height:23px}
.anlegen-menu .submenu-t{margin-bottom:4px}
.anlegen-item .sub-v{color:var(--softer);display:grid;place-items:center}
.anlegen-item .sub-v svg{width:18px;height:18px}
.anlegen-item:hover .sub-v{color:var(--mint-2)}
.anlegen-item.locked{opacity:.72}
.anlegen-sep{height:1px;background:var(--stroke);margin:8px 4px}
.lock-badge{font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:var(--mint-2);background:color-mix(in srgb,var(--mint) 15%,transparent);
  padding:2px 7px;border-radius:20px;margin-left:6px;vertical-align:middle}
.anlegen-kopf{display:flex;align-items:center;gap:10px;padding:12px 14px;margin-bottom:8px;
  background:color-mix(in srgb,var(--mint) 10%,transparent);border:1px solid color-mix(in srgb,var(--mint) 25%,transparent);
  border-radius:13px;font-family:var(--fdisp);font-weight:600;font-size:15px;color:var(--mint-2)}
.anlegen-kopf svg{width:22px;height:22px}
.sub-cat{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--softer);padding:10px 6px 5px}
.sub-cat:first-child{padding-top:2px}
.sub-empty{padding:18px 8px;text-align:center;font-size:13px;color:var(--softer);line-height:1.5}
.rail-btn{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;cursor:pointer;position:relative;
  color:var(--soft);border:1px solid transparent;transition:.16s;background:transparent}
.rail-btn svg{width:21px;height:21px}
.rail-btn:hover{color:var(--text);background:color-mix(in srgb,var(--mint) 8%,transparent)}
.rail-btn.on{color:#052018;background:linear-gradient(150deg,var(--mint),var(--mint-2));box-shadow:0 8px 20px color-mix(in srgb,var(--mint) 35%,transparent)}
.rail-btn .tip{position:absolute;left:58px;top:50%;transform:translateY(-50%);white-space:nowrap;
  background:var(--panel-solid);border:1px solid var(--stroke-2);color:var(--text);font-size:12px;font-weight:600;
  padding:6px 11px;border-radius:9px;opacity:0;pointer-events:none;transition:.15s;z-index:20}
.rail-btn:hover .tip{opacity:1}
.rail-spacer{flex:1}
.rail-btn.logout{color:var(--danger)}

.main{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.head{flex:0 0 auto;padding:calc(38px + env(safe-area-inset-top)) 30px 4px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;position:relative;z-index:3}
.head-logo{height:34px;width:auto;object-fit:contain;opacity:.92;flex:0 0 auto;margin-top:4px}
.scroll-fade{position:absolute;left:0;right:0;height:28px;z-index:2;pointer-events:none;
  background:linear-gradient(180deg,var(--bg),transparent)}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--mint);font-weight:600}
.head h2{font-family:var(--fdisp);font-weight:600;font-size:30px;margin:6px 0 0;letter-spacing:-.02em}
.head .sub{font-size:13px;color:var(--soft);margin-top:4px}
.head-pill{display:flex;align-items:center;gap:9px;background:var(--glass);border:1px solid var(--stroke-2);
  padding:9px 15px;border-radius:99px;font-size:12.5px;color:var(--soft);backdrop-filter:blur(20px);white-space:nowrap}
.head-pill b{color:var(--mint-2);font-family:var(--fdisp);font-weight:600}
.scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  touch-action:pan-y;
  overscroll-behavior-y:contain;scroll-behavior:smooth;scrollbar-gutter:stable;
  padding:22px 30px;padding-bottom:max(40px,env(safe-area-inset-bottom))}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:var(--gap)}

/* ============================ CARDS ============================ */
.grid{display:grid;gap:var(--gap)}
.g-kpi{grid-template-columns:repeat(4,1fr)}
.g-2{grid-template-columns:1fr 1fr}
.g-3{grid-template-columns:repeat(3,1fr)}
.card{position:relative;background:linear-gradient(160deg,var(--glass),var(--glass-2));border:1px solid var(--stroke);
  border-radius:var(--r);backdrop-filter:blur(24px);box-shadow:0 20px 50px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.04);
  overflow:hidden}
.card.pad{padding:22px}
.card-glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(300px 160px at 85% 0%,color-mix(in srgb,var(--mint) 8%,transparent),transparent 60%)}

/* KPI card — reference style: icon chip top-left, big number, small label */
.kpi{position:relative;padding:22px}
.kpi .chip{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--bg) 60%,transparent);border:1px solid var(--stroke-2);color:var(--mint-2);margin-bottom:20px}
.kpi .chip svg{width:22px;height:22px}
.kpi .num{font-family:var(--fdisp);font-weight:600;font-size:40px;line-height:1;letter-spacing:-.02em}
.kpi .lab{font-size:14px;font-weight:600;margin-top:12px}
.kpi .desc{font-size:12px;color:var(--soft);margin-top:3px}
.kpi.accent{background:linear-gradient(160deg,color-mix(in srgb,var(--mint) 16%,transparent),color-mix(in srgb,var(--deep) 10%,transparent))}
.kpi.accent .chip{background:linear-gradient(150deg,var(--mint),var(--deep));color:#052018;border-color:transparent}
.kpi.accent .num{color:var(--mint-2)}

.card-h{padding:20px 22px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.card-t{font-family:var(--fdisp);font-weight:600;font-size:17px;margin:0;letter-spacing:-.01em}
.card-s{font-size:12.5px;color:var(--soft);margin-top:3px}
.card-b{padding:18px 22px 22px}

/* ============================ CHARTS ============================ */
/* Area/line cashflow chart (SVG) */
.chart-wrap{width:100%;overflow:hidden}
.chart{width:100%;height:auto;display:block}
.chart .grid-l{stroke:color-mix(in srgb,var(--mint) 8%,transparent);stroke-width:1}
.chart .area{fill:url(#mintFill)}
.chart .line{fill:none;stroke:var(--mint);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.chart .dot{fill:var(--bg2);stroke:var(--mint);stroke-width:2.5}
.chart .lastdot{fill:var(--mint)}
.chart-x{display:flex;justify-content:space-between;margin-top:8px;font-size:10.5px;color:var(--softer)}

/* Donut / composition */
.donut-row{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.donut{flex:0 0 auto}
.legend{flex:1 1 200px;display:flex;flex-direction:column;gap:10px;min-width:0}
.leg{display:flex;align-items:center;gap:11px;font-size:13px}
.leg .sw{width:11px;height:11px;border-radius:4px;flex:0 0 auto}
.leg .lt{flex:1;color:var(--soft);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leg .lv{font-family:var(--fdisp);font-weight:600;font-variant-numeric:tabular-nums}

/* Horizontal bars */
.hbars{display:flex;flex-direction:column;gap:14px}
.hbar-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;gap:10px}
.hbar-name{font-size:13.5px;font-weight:600}
.hbar-name .loc{font-size:11.5px;color:var(--softer);font-weight:400;margin-left:6px}
.hbar-val{font-family:var(--fdisp);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.track{height:11px;border-radius:99px;background:color-mix(in srgb,var(--bg) 60%,transparent);overflow:hidden;position:relative}
.track>span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--deep),var(--mint));position:relative;transition:width .8s cubic-bezier(.22,.61,.36,1)}
.track.ghost>span{opacity:.4;background:linear-gradient(90deg,color-mix(in srgb,var(--mint) 30%,transparent),color-mix(in srgb,var(--mint) 50%,transparent))}

/* stream tiles (overview list) */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--gap)}
.tile{cursor:pointer;position:relative;padding:20px;border-radius:var(--r-sm);border:1px solid var(--stroke);
  background:linear-gradient(160deg,var(--glass),var(--glass-2));transition:.18s;overflow:hidden}
.tile:hover{border-color:var(--stroke-2);transform:translateY(-2px)}
.tile:hover .tile-go{opacity:1;transform:translateX(0)}
.tile-head{display:flex;align-items:center;gap:13px;margin-bottom:16px}
.tile-ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:0 0 auto;
  background:color-mix(in srgb,var(--bg) 60%,transparent);border:1px solid var(--stroke-2);color:var(--mint-2)}
.tile-ic svg{width:21px;height:21px}
.tile-name{font-family:var(--fdisp);font-weight:600;font-size:15.5px;line-height:1.15}
.tile-loc{font-size:11.5px;color:var(--softer);margin-top:2px}
.tile-num{font-family:var(--fdisp);font-weight:600;font-size:30px;letter-spacing:-.02em}
.tile-num small{font-size:14px;color:var(--soft);font-weight:500}
.tile-meta{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.pillet{font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;background:color-mix(in srgb,var(--bg) 55%,transparent);border:1px solid var(--stroke);color:var(--soft)}
.pillet.on{color:var(--mint-2);border-color:var(--stroke-2);background:color-mix(in srgb,var(--mint) 10%,transparent)}
.pillet.invest{color:var(--gold);background:rgba(216,185,120,.1);border-color:rgba(216,185,120,.25)}
.tile-go{position:absolute;right:18px;top:20px;color:var(--mint);opacity:0;transform:translateX(-4px);transition:.18s}

/* detail rows */
.drow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--stroke)}
.drow:last-child{border-bottom:none}
.drow-l{display:flex;align-items:center;gap:12px;min-width:0}
.drow-badge{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto;
  background:color-mix(in srgb,var(--bg) 60%,transparent);border:1px solid var(--stroke);font-family:var(--fdisp);font-weight:600;font-size:14px;color:var(--mint-2)}
.drow-name{font-weight:600;font-size:14px}
.drow-sub{font-size:11.5px;color:var(--softer)}
.drow-val{text-align:right;flex:0 0 auto}
.drow-val b{font-family:var(--fdisp);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;display:block}
.drow-val span{font-size:11px;color:var(--softer)}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:10.5px;font-weight:700}
.b-on{background:color-mix(in srgb,var(--mint) 16%,transparent);color:var(--mint-2)}
.b-off{background:rgba(216,185,120,.16);color:var(--gold)}

/* ===== SHEET / OVERLAY ===== */
.sheet-bd{position:fixed;inset:0;z-index:70;background:rgba(3,12,9,.62);backdrop-filter:blur(6px);
  opacity:0;transition:opacity .22s ease;display:flex;align-items:center;justify-content:center;padding:24px}
.sheet-bd.on{opacity:1}
.sheet{width:min(560px,100%);max-height:86vh;display:flex;flex-direction:column;
  background:linear-gradient(165deg,color-mix(in srgb,var(--panel-solid) 96%,transparent),color-mix(in srgb,var(--bg) 97%,transparent));
  border:1px solid var(--stroke-2);border-radius:24px;box-shadow:0 40px 100px rgba(0,0,0,.6);
  transform:translateY(14px) scale(.985);opacity:0;transition:.26s cubic-bezier(.22,.61,.36,1);overflow:hidden}
.sheet-bd.on .sheet{transform:none;opacity:1}
.sheet-h{display:flex;align-items:flex-start;gap:12px;padding:22px 22px 0}
.sheet-h .st{flex:1;min-width:0}
.sheet-t{font-family:var(--fdisp);font-size:19px;font-weight:600;letter-spacing:-.01em}
.sheet-s{font-size:12.5px;color:var(--soft);margin-top:3px}
.sheet-x{flex:0 0 auto;width:32px;height:32px;border-radius:10px;border:1px solid var(--stroke-2);
  background:color-mix(in srgb,var(--bg) 50%,transparent);color:var(--soft);cursor:pointer;font-size:17px;line-height:1;transition:.15s}
.sheet-x:hover{color:var(--text);border-color:var(--mint)}
.sheet-b{padding:18px 22px 24px;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.sheet-grip{display:none}
.unit-bar{border-radius:12px;transition:.15s}
.unit-bar:hover{background:color-mix(in srgb,var(--mint) 6%,transparent);box-shadow:0 0 0 10px color-mix(in srgb,var(--mint) 6%,transparent)}
.drow.clickable{border-radius:10px;transition:.15s}
.drow.clickable:hover{background:color-mix(in srgb,var(--mint) 6%,transparent);box-shadow:0 0 0 8px color-mix(in srgb,var(--mint) 6%,transparent)}
.leg.clickable:hover .lt{color:var(--text)}
.w-day.clickable:hover{border-color:var(--mint);background:color-mix(in srgb,var(--mint) 10%,transparent)}
.clickable{cursor:pointer;transition:.16s}
.clickable:hover{border-color:var(--stroke-2);transform:translateY(-1px)}
.clickable:active{transform:translateY(0) scale(.995)}
.tapme{position:absolute;right:14px;top:14px;font-size:10px;color:var(--softer);opacity:0;transition:.16s}
.card.clickable:hover .tapme{opacity:1}
/* Datenzeilen im Sheet */
.kv{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--stroke);font-size:13px}
.kv:last-child{border-bottom:none}
.kv span{color:var(--soft)}
.kv b{font-family:var(--fdisp);font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.kv.muted b{color:var(--softer);font-weight:400;font-family:var(--fbody)}
/* Mini-Bars im Sheet */
.mini{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.mini-row{display:flex;align-items:center;gap:10px;font-size:12px}
.mini-lab{flex:0 0 84px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-track{flex:1;height:8px;border-radius:99px;background:color-mix(in srgb,var(--bg) 60%,transparent);overflow:hidden}
.mini-track>span{display:block;height:100%;border-radius:99px}
.mini-val{flex:0 0 auto;font-family:var(--fdisp);font-weight:600;font-variant-numeric:tabular-nums;min-width:64px;text-align:right}
/* Tilgungstabelle */
.tbl{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums;table-layout:fixed}
.tbl th{text-align:right;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--softer);
  font-weight:600;padding:0 0 8px 8px;border-bottom:1px solid var(--stroke);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:0;width:22%}
.tbl td{padding:8px 0 8px 8px;border-bottom:1px solid color-mix(in srgb,var(--mint) 7%,transparent);text-align:right;white-space:nowrap}
.tbl tr:last-child td{border-bottom:none}
.tbl .hl{color:var(--mint-2);font-weight:600}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x}
/* Stundenverlauf Wetter */
.hours{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.hour{flex:0 0 auto;width:58px;text-align:center;background:color-mix(in srgb,var(--bg) 45%,transparent);border:1px solid var(--stroke);
  border-radius:12px;padding:10px 4px}
.hour .hh{font-size:10.5px;color:var(--softer)}
.hour .hi{font-size:17px;margin:5px 0}
.hour .ht{font-family:var(--fdisp);font-size:13px;font-weight:600}
.hour .hr{font-size:10px;color:var(--mint-2);margin-top:2px}

/* ===== SUBMENU (Vermietung) ===== */
.sub-bd{position:fixed;inset:0;z-index:65;background:rgba(3,12,9,.5);backdrop-filter:blur(4px);
  opacity:0;transition:opacity .2s ease}
.sub-bd.on{opacity:1}
.submenu{position:fixed;z-index:66;background:linear-gradient(165deg,color-mix(in srgb,var(--panel-solid) 97%,transparent),color-mix(in srgb,var(--bg) 99%,transparent));
  border:1px solid var(--stroke-2);border-radius:20px;box-shadow:0 30px 70px rgba(0,0,0,.55);
  padding:10px;min-width:230px;opacity:0;transform:translateX(-8px);transition:.2s cubic-bezier(.22,.61,.36,1)}
.submenu.on{opacity:1;transform:none}
.submenu-t{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--softer);padding:6px 12px 8px}
.sub-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:13px;cursor:pointer;
  transition:.14s;color:var(--soft)}
.sub-item:hover{background:color-mix(in srgb,var(--mint) 10%,transparent);color:var(--text)}
.sub-item.on{background:linear-gradient(150deg,color-mix(in srgb,var(--mint) 20%,transparent),color-mix(in srgb,var(--deep) 14%,transparent));color:var(--text)}
.sub-ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto;
  background:color-mix(in srgb,var(--bg) 55%,transparent);border:1px solid var(--stroke);color:var(--mint-2)}
.sub-ic svg{width:17px;height:17px}
.sub-tx{flex:1;min-width:0}
.sub-n{font-size:13.5px;font-weight:600;line-height:1.15}
.sub-m{font-size:11px;color:var(--softer);margin-top:1px}
.sub-v{font-family:var(--fdisp);font-size:13px;font-weight:600;flex:0 0 auto}

/* ===== REGISTRIERUNG (Reste) ===== */

/* ===== DATENSCHUTZ-ZUSTIMMUNG ===== */
.consent{display:flex;align-items:flex-start;gap:10px;cursor:pointer;margin-top:4px}
.consent input{width:20px;height:20px;flex:0 0 auto;margin-top:1px;accent-color:var(--mint);cursor:pointer}
.consent span{font-size:12.5px;color:var(--soft);line-height:1.45}
.consent a{color:var(--mint-2);text-decoration:underline}

/* ===== DESIGN-AUSWAHL ===== */
.theme-row{display:flex;gap:9px;flex-wrap:wrap}
.theme-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--stroke-2);
  border-radius:12px;background:rgba(255,255,255,.03);color:var(--soft);cursor:pointer;
  padding:9px 13px;font-size:13px;font-weight:600;font-family:var(--fbody);transition:.15s}
.theme-chip:hover{border-color:var(--mint)}
.theme-chip.active{border-color:var(--mint);color:var(--text);background:rgba(255,255,255,.06)}
.theme-sw{width:16px;height:16px;border-radius:50%;background:var(--sw);
  border:1px solid rgba(255,255,255,.2);flex:0 0 auto}
.accent-row{display:flex;gap:11px;flex-wrap:wrap}
.accent-dot{width:32px;height:32px;border-radius:50%;background:var(--ac);cursor:pointer;
  border:2px solid transparent;box-shadow:0 0 0 1px var(--stroke-2);transition:.15s;padding:0}
.accent-dot:hover{transform:scale(1.1)}
.accent-dot.active{border-color:var(--text);box-shadow:0 0 0 2px var(--ac)}

/* ===== ABO / UPGRADE ===== */
.up-hero{text-align:center;padding:6px 0 18px}
.up-badge{display:inline-block;background:color-mix(in srgb,var(--mint) 15%,transparent);color:var(--mint-2);
  font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:5px 12px;border-radius:20px;margin-bottom:12px}
.up-t{font-family:var(--fdisp);font-size:19px;font-weight:600;margin-bottom:8px}
.up-d{font-size:13.5px;color:var(--soft);line-height:1.5;max-width:300px;margin:0 auto}
.up-plan{background:color-mix(in srgb,var(--bg) 50%,transparent);border:1px solid var(--stroke-2);border-radius:18px;padding:20px}
.up-plan-h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.up-plan-n{font-family:var(--fdisp);font-size:18px;font-weight:600}
.up-plan-s{font-size:12px;color:var(--softer);margin-top:2px}
.up-plan-p{font-family:var(--fdisp);font-size:22px;font-weight:600;color:var(--mint-2)}
.up-plan-p span{font-size:12px;color:var(--softer);font-weight:400}
.up-feats{list-style:none;padding:0;margin:0 0 18px}
.up-feats li{position:relative;padding-left:26px;margin-bottom:9px;font-size:13.5px;color:var(--text)}
.up-feats li:before{content:"";position:absolute;left:0;top:3px;width:16px;height:16px;border-radius:50%;
  background:var(--mint);
  -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M20 6L9 17l-5-5'/></svg>") center/12px no-repeat;
  mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M20 6L9 17l-5-5'/></svg>") center/12px no-repeat}
.up-cta{width:100%;border:none;border-radius:13px;cursor:pointer;
  background:linear-gradient(135deg,var(--mint),var(--deep));color:#052018;padding:14px;
  font-size:14.5px;font-weight:700;font-family:var(--fbody);box-shadow:0 10px 26px color-mix(in srgb,var(--deep) 40%,transparent)}
.up-note{text-align:center;font-size:11.5px;color:var(--softer);margin-top:12px}
/* Tarifvergleich */
.tarif-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tarif-card{position:relative;background:color-mix(in srgb,var(--bg) 50%,transparent);border:1px solid var(--stroke-2);
  border-radius:16px;padding:18px 16px;display:flex;flex-direction:column}
.tarif-card.premium{border-color:color-mix(in srgb,var(--mint) 40%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--mint) 8%,transparent),color-mix(in srgb,var(--bg) 50%,transparent))}
.tarif-card.current{outline:2px solid var(--mint)}
.tarif-flag{position:absolute;top:-9px;left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,var(--mint),var(--deep));color:#052018;font-size:10px;
  font-weight:700;padding:3px 10px;border-radius:12px;white-space:nowrap}
.tarif-n{font-family:var(--fdisp);font-size:16px;font-weight:600;margin-bottom:4px}
.tarif-p{font-family:var(--fdisp);font-size:19px;font-weight:600;color:var(--mint-2);margin-bottom:14px}
.tarif-p span{font-size:11px;color:var(--softer);font-weight:400}
.tarif-feats{list-style:none;padding:0;margin:0 0 16px;flex:1}
.tarif-feats li{position:relative;padding-left:18px;margin-bottom:7px;font-size:12px;color:var(--soft);line-height:1.3}
.tarif-feats li:before{content:"";position:absolute;left:0;top:4px;width:11px;height:11px;border-radius:50%;background:var(--mint);
  -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'><path d='M20 6L9 17l-5-5'/></svg>") center/9px no-repeat;
  mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'><path d='M20 6L9 17l-5-5'/></svg>") center/9px no-repeat}
.tarif-btn{width:100%;border:1px solid var(--stroke-2);border-radius:11px;cursor:pointer;
  background:color-mix(in srgb,var(--bg) 50%,transparent);color:var(--mint-2);padding:11px;font-size:13px;font-weight:600;font-family:var(--fbody)}
.tarif-btn.prem{border:none;background:linear-gradient(135deg,var(--mint),var(--deep));color:#052018}
.tarif-badge{text-align:center;font-size:12px;font-weight:600;color:var(--mint-2);padding:11px}
.tarif-code{margin-top:18px}
.tarif-code-row{display:flex;gap:8px}
.tarif-code-row .ef-i{flex:1}
.tarif-code-btn{flex:0 0 auto;border:1px solid var(--stroke-2);border-radius:11px;cursor:pointer;
  background:color-mix(in srgb,var(--bg) 50%,transparent);color:var(--soft);padding:0 16px;font-size:13px;font-weight:600;font-family:var(--fbody)}
/* Profil-Tarif */
.prof-tarif .pt-row{display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--bg) 50%,transparent);
  border:1px solid var(--stroke-2);border-radius:13px;padding:13px 15px}
.pt-name{font-family:var(--fdisp);font-size:15px;font-weight:600;padding:3px 11px;border-radius:8px}
.pt-name.premium{color:#052018;background:linear-gradient(135deg,var(--mint),var(--deep))}
.pt-name.basic{color:var(--mint-2);background:color-mix(in srgb,var(--mint) 12%,transparent)}
.pt-name.test{color:var(--gold);background:rgba(216,161,58,.14)}
.pt-name.gesperrt{color:var(--danger);background:rgba(224,110,95,.12)}
.pt-status{font-size:12.5px;color:var(--soft)}

/* ===== ONBOARDING-FUNNEL ===== */
.wc-logo{display:block;height:38px;width:auto;margin:0 auto 16px;object-fit:contain}
.wc-steps{display:flex;justify-content:center;gap:7px;margin-bottom:16px}
.wc-steps span{width:28px;height:4px;border-radius:2px;background:var(--stroke-2);transition:.3s}
.wc-steps span.on{background:var(--mint);width:34px}
.wc-steps span.done{background:color-mix(in srgb,var(--mint) 55%,transparent)}
.ob-arten{display:flex;flex-direction:column;gap:11px}
.ob-art{display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;
  background:color-mix(in srgb,var(--bg) 50%,transparent);border:1px solid var(--stroke-2);
  border-radius:15px;padding:16px 18px;transition:.15s;color:var(--text);font-family:var(--fbody)}
.ob-art:hover{border-color:var(--mint);background:color-mix(in srgb,var(--mint) 8%,transparent)}
.ob-art svg{width:26px;height:26px;color:var(--mint-2);flex:0 0 auto}
.ob-art-n{font-size:15px;font-weight:600}
.ob-art-m{font-size:12.5px;color:var(--softer);margin-top:2px}
.wc-skip{text-align:center;margin-top:18px}
.wc-skip a{font-size:12.5px;color:var(--softer);text-decoration:underline;text-underline-offset:2px}
.frage-opts{display:flex;flex-direction:column;gap:10px}
.frage-opt{width:100%;text-align:left;cursor:pointer;background:color-mix(in srgb,var(--bg) 50%,transparent);
  border:1px solid var(--stroke-2);border-radius:14px;padding:16px 18px;font-size:14.5px;font-weight:500;
  color:var(--text);font-family:var(--fbody);transition:.15s}
.frage-opt:hover{border-color:var(--mint);background:color-mix(in srgb,var(--mint) 10%,transparent);transform:translateX(3px)}
.empf-plan{background:color-mix(in srgb,var(--bg) 50%,transparent);border:1px solid var(--stroke-2);
  border-radius:18px;padding:20px;margin-bottom:6px}
.empf-plan.premium{border-color:color-mix(in srgb,var(--mint) 45%,transparent);
  background:linear-gradient(180deg,color-mix(in srgb,var(--mint) 9%,transparent),color-mix(in srgb,var(--bg) 50%,transparent))}
.empf-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.empf-n{font-family:var(--fdisp);font-size:19px;font-weight:600}
.empf-p{font-family:var(--fdisp);font-size:20px;font-weight:600;color:var(--mint-2)}
.empf-p span{font-size:11px;color:var(--softer);font-weight:400}

/* ===== ABO VERWALTEN (dezent) ===== */
.abo-verwalten{text-align:center;margin-top:16px}
.abo-verwalten a{font-size:12px;color:var(--softer);text-decoration:underline;text-underline-offset:2px}
.abo-verwalten a:hover{color:var(--soft)}

/* ===== TOAST / EINBLENDUNG ===== */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
  z-index:120;background:var(--panel-solid);color:var(--text);border:1px solid var(--stroke-2);
  padding:13px 20px;border-radius:14px;font-size:13.5px;font-weight:500;max-width:88vw;text-align:center;
  box-shadow:0 16px 40px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.3s cubic-bezier(.4,0,.2,1)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ===== WILLKOMMEN / ONBOARDING ===== */
.wc-hero{text-align:center;padding:4px 0 20px}
.wc-badge{display:inline-block;background:color-mix(in srgb,var(--mint) 15%,transparent);color:var(--mint-2);
  font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:5px 13px;border-radius:20px;margin-bottom:13px}
.wc-t{font-family:var(--fdisp);font-size:22px;font-weight:600;margin-bottom:9px}
.wc-d{font-size:13.5px;color:var(--soft);line-height:1.55;max-width:330px;margin:0 auto}
.wc-plans{display:flex;flex-direction:column;gap:13px}
.wc-plan{position:relative;background:color-mix(in srgb,var(--bg) 50%,transparent);
  border:1px solid var(--stroke-2);border-radius:18px;padding:20px}
.wc-plan.premium{border-color:color-mix(in srgb,var(--mint) 40%,transparent);
  background:linear-gradient(180deg,color-mix(in srgb,var(--mint) 8%,transparent),color-mix(in srgb,var(--bg) 50%,transparent))}
.wc-flag{position:absolute;top:-9px;right:18px;background:linear-gradient(135deg,var(--mint),var(--deep));
  color:#08120f;font-size:10px;font-weight:700;padding:3px 11px;border-radius:12px}
.wc-plan-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.wc-plan-n{font-family:var(--fdisp);font-size:18px;font-weight:600}
.wc-plan-s{font-size:12px;color:var(--softer);margin-top:2px}
.wc-plan-p{font-family:var(--fdisp);font-size:21px;font-weight:600;color:var(--mint-2)}
.wc-plan-p span{font-size:11px;color:var(--softer);font-weight:400}
.wc-feats{list-style:none;padding:0;margin:0 0 16px}
.wc-feats li{position:relative;padding-left:24px;margin-bottom:8px;font-size:13px;color:var(--text)}
.wc-feats li:before{content:"";position:absolute;left:0;top:3px;width:15px;height:15px;border-radius:50%;
  background:var(--mint);
  -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M20 6L9 17l-5-5'/></svg>") center/11px no-repeat;
  mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M20 6L9 17l-5-5'/></svg>") center/11px no-repeat}
.wc-cta{width:100%;border:1px solid var(--stroke-2);border-radius:12px;cursor:pointer;
  background:color-mix(in srgb,var(--bg) 50%,transparent);color:var(--mint-2);padding:13px;
  font-size:14px;font-weight:700;font-family:var(--fbody);transition:.15s}
.wc-cta:hover{border-color:var(--mint)}
.wc-cta.prem{border:none;background:linear-gradient(135deg,var(--mint),var(--deep));color:#08120f;
  box-shadow:0 10px 26px color-mix(in srgb,var(--deep) 40%,transparent)}
.wc-cta:disabled{opacity:.6;cursor:wait}
.wc-note{text-align:center;font-size:11.5px;color:var(--softer);margin-top:16px}

/* ===== BILD ZUSCHNEIDEN ===== */
#cropper{position:fixed;inset:0;z-index:120;display:grid;place-items:center;padding:22px;
  background:rgba(4,12,9,.86);backdrop-filter:blur(8px)}
#cropper.hide{display:none}
.crop-card{width:min(360px,100%);background:linear-gradient(180deg,var(--glass),var(--glass-2));
  border:1px solid var(--stroke-2);border-radius:24px;padding:22px;
  box-shadow:0 30px 80px rgba(0,0,0,.6)}
.crop-title{font-family:var(--fdisp);font-size:17px;font-weight:600;text-align:center;margin-bottom:16px}
.crop-stage{position:relative;width:260px;height:260px;margin:0 auto;border-radius:16px;
  overflow:hidden;background:#061410;touch-action:none;cursor:grab;user-select:none}
.crop-stage:active{cursor:grabbing}
.crop-stage img{position:absolute;top:0;left:0;transform-origin:0 0;pointer-events:none;
  -webkit-user-drag:none}
.crop-mask{position:absolute;inset:0;pointer-events:none;
  box-shadow:0 0 0 999px rgba(4,12,9,.6);border-radius:50%;
  border:2px solid rgba(255,255,255,.7)}
.crop-zoom{display:flex;align-items:center;gap:12px;margin:18px 4px 4px;color:var(--soft)}
.crop-zoom svg{width:20px;height:20px;flex:0 0 auto}
.crop-zoom input{flex:1;-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;
  background:var(--stroke-2);outline:none}
.crop-zoom input::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;
  border-radius:50%;background:linear-gradient(135deg,var(--mint),var(--deep));cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.4)}
.crop-zoom input::-moz-range-thumb{width:20px;height:20px;border:none;border-radius:50%;
  background:var(--mint);cursor:pointer}
.crop-actions{display:flex;gap:10px;margin-top:20px}
.crop-cancel{flex:1;border:1px solid var(--stroke-2);border-radius:12px;cursor:pointer;
  background:color-mix(in srgb,var(--bg) 50%,transparent);color:var(--soft);padding:13px;font-size:14px;font-weight:600;
  font-family:var(--fbody)}
.crop-ok{flex:1;border:none;border-radius:12px;cursor:pointer;
  background:linear-gradient(135deg,var(--mint),var(--deep));color:#052018;padding:13px;
  font-size:14px;font-weight:700;font-family:var(--fbody)}

/* ===== PROFIL ===== */
.prof-head{display:flex;flex-direction:column;align-items:center;margin:6px 0 8px}
.ava-letter{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fdisp);
  font-size:38px;font-weight:600;color:#052018;border-radius:50%;
  background:linear-gradient(135deg,var(--mint),var(--deep))}
.prof-cap{margin-top:11px;font-size:12.5px;color:var(--softer)}

/* ===== BEARBEITEN ===== */
.ef-row{margin-bottom:12px}
.ef-l{display:block;font-size:11.5px;color:var(--soft);margin-bottom:5px;letter-spacing:.01em}
.ef-req{color:var(--gold)}
.ef-i{width:100%;background:color-mix(in srgb,var(--bg) 60%,transparent);border:1px solid var(--stroke-2);border-radius:11px;
  padding:11px 13px;color:var(--text);font-family:var(--fbody);font-size:15px;outline:none;
  transition:.15s;-webkit-appearance:none;appearance:none}
.ef-i:focus{border-color:var(--mint);box-shadow:0 0 0 3px color-mix(in srgb,var(--mint) 15%,transparent)}
.ef-i[readonly]{opacity:.55;cursor:not-allowed}
textarea.ef-i{resize:vertical;line-height:1.45;font-size:14px}
select.ef-i{cursor:pointer;background-image:none}
select.ef-i option{background:var(--panel-solid);color:var(--text)}
.ef-h{font-size:11px;color:var(--softer);margin-top:5px;line-height:1.4}
.ef-sec{font-family:var(--fdisp);font-size:12px;font-weight:600;color:var(--mint-2);
  text-transform:uppercase;letter-spacing:.08em;margin:20px 0 10px;padding-bottom:6px;
  border-bottom:1px solid var(--stroke)}
.ef-sec:first-child{margin-top:0}
.ef-actions{display:flex;gap:9px;margin-top:20px}
.ef-save{flex:1;border:none;border-radius:12px;cursor:pointer;
  background:linear-gradient(135deg,var(--mint),var(--deep));color:#052018;
  padding:13px;font-size:14.5px;font-weight:700;font-family:var(--fbody);transition:.15s}
.ef-save:hover{filter:brightness(1.07)}
.ef-save:disabled{opacity:.5;cursor:wait}
.ef-del{flex:0 0 auto;border:1px solid rgba(224,110,95,.4);border-radius:12px;cursor:pointer;
  background:rgba(224,110,95,.1);color:#e06e5f;padding:13px 16px;font-size:13.5px;
  font-weight:600;font-family:var(--fbody);transition:.15s;white-space:nowrap}
.ef-del:hover{background:rgba(224,110,95,.18)}
.ef-del.armed{background:#c4564a;color:#fff;border-color:#c4564a}
.ef-del:disabled{opacity:.5;cursor:wait}
.ef-msg{min-height:17px;margin-top:11px;font-size:12.5px;color:var(--soft);line-height:1.4}
.ef-msg.bad{color:#e06e5f}
.ef-open{width:100%;margin-top:20px;border:1px solid var(--stroke-2);border-radius:12px;
  cursor:pointer;background:color-mix(in srgb,var(--bg) 50%,transparent);color:var(--mint-2);padding:12px;
  font-size:14px;font-weight:600;font-family:var(--fbody);transition:.15s}
.ef-open:hover{border-color:var(--mint);background:color-mix(in srgb,var(--mint) 10%,transparent)}
.add-btn{border:1px solid var(--stroke-2);border-radius:10px;cursor:pointer;
  background:color-mix(in srgb,var(--bg) 50%,transparent);color:var(--soft);padding:8px 13px;font-size:12.5px;
  font-weight:600;font-family:var(--fbody);transition:.15s;white-space:nowrap}
.add-btn:hover{color:var(--mint-2);border-color:var(--mint);background:color-mix(in srgb,var(--mint) 9%,transparent)}
.add-btn.wide{width:100%;padding:13px;font-size:14px}
.add-card{border-style:dashed;background:transparent}
.obj-bar{display:flex;justify-content:flex-end;margin-bottom:-4px}

/* Begrüßung */
.hello{background:linear-gradient(140deg,color-mix(in srgb,var(--mint) 14%,transparent),color-mix(in srgb,var(--deep) 6%,transparent) 60%,transparent);
  border-color:color-mix(in srgb,var(--mint) 24%,transparent)}
.hello.has-ava{display:flex;align-items:center;gap:16px}
.hello-ava{width:76px;height:76px;border-radius:50%;flex:0 0 auto;background-size:cover;
  background-position:center;border:2.5px solid var(--mint)}
.hello-ava-i{display:grid;place-items:center;font-family:var(--fdisp);font-size:30px;
  font-weight:600;color:#052018;background:linear-gradient(135deg,var(--mint),var(--deep))}
.hello-body{flex:1;min-width:0}
.hello-t{font-family:var(--fdisp);font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.hello-f{font-size:13.5px;color:var(--soft);margin-top:9px;line-height:1.5}
.hello-f b{color:var(--mint-2);font-family:var(--fdisp);font-weight:600}
.hello-d{font-size:11.5px;color:var(--softer);margin-top:12px}
/* Suche */
.search-box{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--bg) 55%,transparent);
  border:1px solid var(--stroke-2);border-radius:14px;padding:4px 6px 4px 13px;transition:.16s}
.search-box:focus-within{border-color:var(--mint);box-shadow:0 0 0 3px color-mix(in srgb,var(--mint) 14%,transparent)}
.search-ic{flex:0 0 auto;color:var(--softer);display:grid;place-items:center}
.search-ic svg{width:17px;height:17px}
.search-box input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--text);
  font-family:var(--fbody);font-size:15px;padding:11px 0;-webkit-appearance:none}
.search-box input::placeholder{color:var(--softer)}
.search-box input::-webkit-search-cancel-button{-webkit-appearance:none}
.mic-btn{flex:0 0 auto;width:38px;height:38px;border-radius:11px;border:1px solid var(--stroke-2);
  background:color-mix(in srgb,var(--bg) 50%,transparent);color:var(--soft);cursor:pointer;display:grid;place-items:center;transition:.16s}
.mic-btn svg{width:17px;height:17px}
.mic-btn:hover{color:var(--text);border-color:var(--mint)}
.mic-btn.on{background:linear-gradient(140deg,var(--mint),var(--deep));color:#052018;
  border-color:transparent;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--mint) 50%,transparent)}50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--mint) 0%,transparent)}}
.search-hint{font-size:11.5px;color:var(--softer);margin-top:10px}
.qres{margin-top:14px;display:flex;flex-direction:column;gap:2px}
.qr{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;cursor:pointer;
  transition:.14s;border:1px solid transparent}
.qr:hover{background:color-mix(in srgb,var(--mint) 8%,transparent);border-color:var(--stroke-2)}
.qr.top{background:color-mix(in srgb,var(--mint) 9%,transparent);border-color:color-mix(in srgb,var(--mint) 26%,transparent)}
.qr-l{flex:1;min-width:0}
.qr-t{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qr-d{font-size:11.5px;color:var(--softer);margin-top:2px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.qr-v{flex:0 0 auto;font-family:var(--fdisp);font-size:15px;font-weight:600;color:var(--mint-2);
  font-variant-numeric:tabular-nums}
/* Login-Dropdown */
.field.sel{position:relative}
.field.sel:after{content:"";position:absolute;right:16px;top:50%;width:7px;height:7px;
  border-right:2px solid var(--soft);border-bottom:2px solid var(--soft);
  transform:translateY(-70%) rotate(45deg);pointer-events:none}
.field.sel select{width:100%;background:color-mix(in srgb,var(--bg) 60%,transparent);border:1px solid var(--stroke-2);
  border-radius:13px;padding:14px 38px 14px 15px;color:var(--text);font-family:var(--fbody);
  font-size:15px;outline:none;-webkit-appearance:none;appearance:none;cursor:pointer}
.field.sel select:focus{border-color:var(--mint);box-shadow:0 0 0 3px color-mix(in srgb,var(--mint) 15%,transparent)}
.field.sel select option{background:var(--panel-solid);color:var(--text)}

/* Slider (AirBNB-Auslastung) */
.sld-wrap{background:color-mix(in srgb,var(--bg) 45%,transparent);border:1px solid var(--stroke);border-radius:16px;padding:16px 18px;margin-bottom:16px}
.sld-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.sld-lab{font-size:12.5px;color:var(--soft)}
.sld-val{font-family:var(--fdisp);font-size:26px;font-weight:600;color:var(--mint-2);letter-spacing:-.02em}
input[type=range].sld{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;
  background:linear-gradient(90deg,var(--mint) var(--p,65%),color-mix(in srgb,var(--bg) 70%,transparent) var(--p,65%));outline:none;margin:0}
input[type=range].sld::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  background:linear-gradient(150deg,var(--mint-2),var(--mint));border:2px solid var(--bg);cursor:grab;
  box-shadow:0 3px 10px rgba(0,0,0,.4)}
input[type=range].sld::-webkit-slider-thumb:active{cursor:grabbing;transform:scale(1.1)}
input[type=range].sld::-moz-range-thumb{width:20px;height:20px;border-radius:50%;border:2px solid var(--bg);
  background:var(--mint);cursor:grab}
.sld-marks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--softer);margin-top:8px}
/* Timeline (Kalender-Insights) */
.tl{display:flex;flex-direction:column;gap:0}
.tl-i{display:flex;gap:12px;padding-bottom:14px;position:relative}
.tl-i:not(:last-child)::before{content:"";position:absolute;left:5px;top:14px;bottom:0;width:1px;background:var(--stroke)}
.tl-dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;margin-top:3px;position:relative;z-index:1;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--bg) 90%,transparent)}
.tl-b{flex:1;min-width:0}
.tl-t{font-size:13px;font-weight:600}
.tl-s{font-size:11.5px;color:var(--softer);margin-top:2px}
.tl-v{font-family:var(--fdisp);font-weight:600;font-size:13px;flex:0 0 auto}

/* Kalender — Monatsansicht */
.cal-nav{display:flex;gap:6px;align-items:center}
.cal-btn{background:color-mix(in srgb,var(--bg) 50%,transparent);border:1px solid var(--stroke-2);color:var(--soft);border-radius:10px;
  min-width:30px;height:30px;padding:0 9px;font-size:13px;font-family:var(--fbody);cursor:pointer;transition:.15s;line-height:1}
.cal-btn:hover{color:var(--text);border-color:var(--mint);background:color-mix(in srgb,var(--mint) 10%,transparent)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-dow{text-align:center;font-size:10.5px;color:var(--softer);text-transform:uppercase;letter-spacing:.06em;padding-bottom:4px}
.cal-cell{position:relative;aspect-ratio:1/1;border-radius:11px;border:1px solid transparent;
  background:color-mix(in srgb,var(--bg) 32%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  cursor:pointer;transition:.14s;-webkit-tap-highlight-color:transparent}
.cal-cell.empty{background:transparent;border-color:transparent;cursor:default;pointer-events:none}
.cal-cell:not(.empty):hover{border-color:var(--stroke-2)}
.cal-cell.has{font-weight:600}
.cal-cell.today{outline:1.5px solid var(--mint);outline-offset:-1.5px}
.cal-cell.sel{border-color:var(--mint-2)!important;box-shadow:0 0 0 2px color-mix(in srgb,var(--mint-2) 28%,transparent)}
.cal-n{font-family:var(--fdisp);font-size:14px;line-height:1;font-variant-numeric:tabular-nums}
.cal-dots{display:flex;gap:3px;height:5px;align-items:center}
.cal-d{width:5px;height:5px;border-radius:50%}
.cal-detail{margin-top:16px;padding-top:15px;border-top:1px solid var(--stroke)}
.cal-detail-h{font-family:var(--fdisp);font-size:14px;font-weight:600;margin-bottom:11px}
.cal-ev{border-left:3px solid var(--mint);background:color-mix(in srgb,var(--bg) 40%,transparent);border-radius:0 10px 10px 0;padding:10px 13px;margin-bottom:8px}
.cal-ev:last-child{margin-bottom:0}
.cal-ev-t{font-size:13px;font-weight:600}
.cal-ev-i{font-size:11.5px;color:var(--softer);margin-top:2px}
.cal-hint{font-size:12.5px;color:var(--softer);margin-top:14px;padding-top:14px;border-top:1px solid var(--stroke)}
.cal-detail .cal-hint{margin-top:0;padding-top:0;border-top:none}
/* Wetter */
.w-now{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.w-now-ic{font-size:44px;line-height:1}
.w-now-t{font-family:var(--fdisp);font-size:38px;font-weight:600;line-height:1;letter-spacing:-.02em}
.w-now-d{font-size:12.5px;color:var(--soft);margin-top:4px}
.w-days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.w-day{background:color-mix(in srgb,var(--bg) 45%,transparent);border:1px solid var(--stroke);border-radius:12px;padding:11px 6px;text-align:center}
.w-dow{display:block;font-size:10.5px;color:var(--soft);text-transform:capitalize}
.w-ic{display:block;font-size:20px;margin:6px 0}
.w-t b{font-family:var(--fdisp);font-size:13px;font-weight:600}
.w-t i{font-style:normal;font-size:11.5px;color:var(--softer);margin-left:4px}

.stat-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--stroke);
  border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--stroke)}
/* ETF live-cards */
.etf-grid{gap:var(--gap)}
.etf-card{display:flex;flex-direction:column}
.etf-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.etf-badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.etf-badge svg{width:20px;height:20px}
.etf-cagr{font-size:11.5px;font-weight:600;color:var(--mint-2);background:color-mix(in srgb,var(--mint) 10%,transparent);border:1px solid var(--stroke-2);padding:5px 11px;border-radius:99px}
.etf-name{font-family:var(--fdisp);font-weight:600;font-size:16px}
.etf-sub{font-size:11px;color:var(--softer);margin-top:3px}
.etf-val{font-family:var(--fdisp);font-weight:600;font-size:30px;letter-spacing:-.02em;margin:14px 0 4px}
.etf-foot{display:flex;justify-content:space-between;align-items:baseline;margin-top:auto;padding-top:12px;border-top:1px solid var(--stroke);font-size:12px;color:var(--soft)}
.etf-foot b{font-family:var(--fdisp);color:var(--text)}
.stat-strip .s{background:var(--glass-2);padding:16px 18px}
.stat-strip .s span{font-size:11px;color:var(--soft);display:block}
.stat-strip .s b{font-family:var(--fdisp);font-weight:600;font-size:20px;margin-top:5px;display:block;font-variant-numeric:tabular-nums}

.note{font-size:12.5px;color:var(--soft);line-height:1.5}

.view{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.wrap>*{animation:fade .4s ease both}
.wrap>*:nth-child(2){animation-delay:.05s}.wrap>*:nth-child(3){animation-delay:.1s}
.wrap>*:nth-child(4){animation-delay:.15s}.wrap>*:nth-child(n+5){animation-delay:.2s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============================ iPad Pro 13" ============================ */
@media(max-width:1200px){
  .g-kpi{grid-template-columns:repeat(2,1fr)}
  .head h2{font-size:27px}
}
@media(max-width:900px){
  .g-2,.g-3{grid-template-columns:1fr}
  .tiles{grid-template-columns:1fr}
}

/* ============================ iPhone 17 Pro Max ============================ */
@media(max-width:560px){
  #app{grid-template-columns:1fr;grid-template-rows:1fr;height:100dvh;height:100svh}
  /* Navigationsleiste fest am unteren Bildschirmrand (wie Instagram) */
  .rail{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;width:100%;flex-direction:row;
    justify-content:space-around;align-items:stretch;padding:7px 6px 0;
    border-right:none;border-top:1px solid var(--stroke);z-index:50;gap:2px;
    box-sizing:border-box;
    /* Buttons müssen tippbar sein — body hat touch-action:none, hier zurückgeben */
    touch-action:manipulation;pointer-events:auto;
    /* Home-Indicator-Aussparung als Innenabstand, aber knapp gehalten */
    padding-bottom:calc(env(safe-area-inset-bottom) * 0.6 + 4px);
    background:color-mix(in srgb,var(--bg2) 96%,transparent);
    backdrop-filter:blur(20px) saturate(1.2);-webkit-backdrop-filter:blur(20px) saturate(1.2)}
  .rail-mark,.rail-spacer{display:none}
  .rail-btn{width:auto;height:auto;flex:1 1 0;flex-direction:column;gap:3px;padding:6px 4px;border-radius:12px;font-size:9px;
    touch-action:manipulation;pointer-events:auto;cursor:pointer}
  .rail-btn svg{width:23px;height:23px;pointer-events:none}
  .rail-btn .tip{position:static;transform:none;opacity:1;background:none;border:none;padding:0;color:inherit;
    font-size:9.5px;font-weight:600;pointer-events:none}
  .rail-btn.on .tip{color:var(--mint-2)}
  .rail-btn.logout .tip{color:var(--danger)}
  /* Neu-Knopf reiht sich ein, nur Icon in Akzentfarbe */
  .rail-add{background:none!important;color:var(--mint)!important;box-shadow:none!important;margin:0!important}
  .rail-add .tip{color:var(--mint)!important}
  .rail-add svg{width:22px;height:22px}

  .main{height:100dvh;height:100svh;min-height:0}
  .head{padding:calc(10px + env(safe-area-inset-top)) 18px 2px;flex-direction:column;gap:6px}
  .head-logo{height:26px;order:-1;align-self:flex-start;margin:0 0 6px}
  .head h2{font-size:23px;line-height:1.15;margin:1px 0 0}
  .head .eyebrow{font-size:11px}
  .head .sub{margin-top:1px}
  .head-pill{align-self:flex-start}
  .scroll{padding:14px 16px;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
  .g-kpi{grid-template-columns:1fr 1fr;gap:12px}
  .kpi{padding:16px}
  .kpi .chip{width:40px;height:40px;margin-bottom:14px}
  .kpi .num{font-size:30px}
  .kpi .lab{font-size:13px;margin-top:9px}
  .card.pad{padding:17px}
  .card-h{padding:17px 17px 0}.card-b{padding:15px 17px 18px}
  .hello-t{font-size:22px}
  .hello-f{font-size:12.5px}
  .search-box input{font-size:16px}
  .qr-v{font-size:14px}
  .donut-row{gap:16px}
  .w-now-t{font-size:32px}.w-now-ic{font-size:36px}
  .w-days{gap:6px}.w-day{padding:9px 3px}
  .w-ic{font-size:17px;margin:5px 0}
  .w-t b{font-size:12px}.w-t i{font-size:10.5px;margin-left:3px}
  /* Sheet fährt von unten hoch */
  .sheet-bd{align-items:flex-end;padding:0}
  .sheet{width:100%;max-height:88vh;border-radius:24px 24px 0 0;transform:translateY(100%);
    padding-bottom:env(safe-area-inset-bottom)}
  .sheet-bd.on .sheet{transform:none}
  .sheet-grip{display:block;width:38px;height:4px;border-radius:99px;background:color-mix(in srgb,var(--mint) 30%,transparent);
    margin:10px auto 2px}
  .sheet-h{padding:8px 18px 0}
  .sheet-b{padding:16px 18px 22px}
  .sheet-t{font-size:17px}
  /* Submenü als Bottom-Sheet */
  .submenu{left:0;right:0;bottom:0;top:auto;border-radius:22px 22px 0 0;min-width:0;
    padding:10px 12px calc(14px + env(safe-area-inset-bottom));transform:translateY(100%)}
  .submenu.on{transform:none}
  .cal-grid{gap:4px}
  .cal-n{font-size:12.5px}
  .cal-cell{border-radius:9px}
  .cal-d{width:4px;height:4px}
  .cal-dow{font-size:9.5px}
  .tile-num{font-size:26px}
  .stat-strip{grid-template-columns:1fr 1fr}
}
@media(max-width:380px){
  .g-kpi{grid-template-columns:1fr}
  .rail-btn .tip{font-size:9px}
}
</style>
</head>

<script>
  // Theme sofort anwenden (vor dem Zeichnen), damit nichts flackert
  (function(){
    try{
      var t = localStorage.getItem("estriq_theme");
      var a = localStorage.getItem("estriq_accent");
      if(t) document.documentElement.setAttribute("data-theme", t);
      document.documentElement.setAttribute("data-accent", a || "silber");
      document.documentElement.classList.add("pre-login");
    }catch(e){ document.documentElement.setAttribute("data-accent","silber"); document.documentElement.classList.add("pre-login"); }
  })();
  // Service Worker registrieren (macht die App installierbar)
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>

<!-- LOGIN -->
<div id="login">
  <div class="login-card">
    <div class="login-orb"></div>

    <div class="login-logo">
      <img src="estriq.PNG" alt="ESTRIQ" class="login-logo-img" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <div class="login-logo-fallback" style="display:none">
        <div class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M4 15c3-1 5-9 8-9s3 8 4 9" stroke="#052018" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="18" r="1.6" fill="#052018"/></svg></div>
        <div class="login-logo-txt"><h1>ESTRIQ</h1></div>
      </div>
    </div>

    <div class="login-tabs">
      <button type="button" class="ltab active" id="tabLogin">Anmelden</button>
      <button type="button" class="ltab" id="tabRegister">Registrieren</button>
      <div class="ltab-ind" id="tabInd"></div>
    </div>

    <div class="login-form">
      <div id="rowAvatar" class="hide">
        <button type="button" class="ava-circle" id="avaBtn" aria-label="Profilbild wählen">
          <div class="ava-img" id="avaPrev"></div>
          <svg class="ava-cam" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          <div class="ava-edit" id="avaEdit"><svg viewBox="0 0 24 24" fill="none" stroke="#052018" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></div>
        </button>
        <div class="ava-cap" id="avaCap">Profilbild hinzufügen</div>
        <input type="file" id="avaFile" accept="image/*" class="hide">
      </div>

      <div id="rowName" class="field-row rowreg hide">
        <label for="regName">Name</label>
        <input id="regName" type="text" autocomplete="name" placeholder="Vor- und Nachname">
      </div>

      <div id="rowMail" class="field-row">
        <label for="mail">E-Mail</label>
        <input id="mail" type="email" autocomplete="email" placeholder="name@beispiel.de">
      </div>

      <div class="field-row">
        <label for="pw" id="pwLabel">Passwort</label>
        <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••">
      </div>

      <div id="rowConsent" class="rowreg hide">
        <label class="consent">
          <input type="checkbox" id="consentBox">
          <span>Ich stimme der Speicherung meiner Daten gemäß der <a href="#" id="datenschutzLink">Datenschutzerklärung</a> zu.</span>
        </label>
      </div>

      <button class="login-btn" id="loginBtn">Anmelden</button>
      <button class="login-btn hide" id="registerBtn">Konto erstellen</button>
      <div class="login-msg" id="loginMsg"></div>
    </div>
  </div>
</div>
